name=SensorSync
version=1.1.0
author=Matheus Willian Sprotte <msprotte@outlook.com>
maintainer=Matheus Willian Sprotte <msprotte@outlook.com>
sentence=Send sensor readings from ESP8266/ESP32 boards to the self-hosted SensorSync IoT platform over HTTP or MQTT, with optional TLS.
paragraph=Client for the SensorSync platform (https://github.com/mwsprotte/sensorsync). Per-device token authentication, optional TLS (HTTPS and MQTT over TLS) pinned to the server CA, non-blocking Wi-Fi and MQTT reconnection, and JSON payloads built without allocating Strings on every send. Documentation in English and Portuguese.
category=Communication
url=https://github.com/mwsprotte/sensorsync_lib
architectures=esp8266,esp32
depends=PubSubClient
includes=SensorSync.h
